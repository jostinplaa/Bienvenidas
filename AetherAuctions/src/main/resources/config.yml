# === AetherAuctions: General Configuration ===
# Config Version: 1.1 (Do not modify unless you know what you are doing)

plugin_settings:
  # Visual prefix for most plugin messages.
  prefix: "&6[&eAetherAuctions&6] &r"
  # Name of the language file (located in the plugin's folder).
  language_file: "messages.yml"
  # Interval (in seconds) for the task that checks and processes expired auctions.
  auction_expiration_check_interval_seconds: 60

database:
  # Database type. Currently, only "sqlite" is supported.
  type: "sqlite"
  # Filename for the SQLite database. It will be created in 'plugins/AetherAuctions/database/'.
  sqlite_filename: "auctions_data.db"

economy:
  # Symbol for the currency used in auction transactions (e.g., $, €, Coins).
  currency_symbol: "$"
  # Future options for virtual currency could be added here.
  # enable_virtual_currency: false
  # virtual_currency_name: "Gems"

# Module loading configuration.
# Set to 'true' to load the respective .yml file, 'false' to use internal defaults (if available) or disable the feature.
# This allows selective loading if a config file is problematic or a feature is not desired.
load_modules:
  gui_config: true
  sounds_config: true
  commissions_config: true
  rewards_config: true
  history_config: true
  limits_config: true
  announcements_config: true
  vip_tiers_config: true

command_suggestions:
  # Enable command suggestions if a player types an unknown subcommand (e.g., /ah helo -> Did you mean /ah help?).
  enable: true
  # Similarity threshold (0.0 to 1.0) for a suggestion to be made. Higher is stricter.
  similarity_threshold: 0.75

logging_and_debug:
  # Enables more detailed console messages for debugging. Recommended to keep 'false' on production servers.
  verbose_console_output: false
  # Future debug flags:
  # log_database_queries: false
  # log_gui_event_processing: false
  # log_commission_calculation: false
