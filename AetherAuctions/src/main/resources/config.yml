# Configuración General de AetherAuctions
general:
  plugin_prefix: "&e&lAetherAuctions &8» " # Prefijo para mensajes del plugin
  currency_symbol: "$" # Símbolo de la moneda
  date_format: "dd/MM/yyyy HH:mm" # Formato de fecha para historial, etc.
  max_active_auctions_per_player: 5 # Límite de subastas activas por jugador normal
  log_level: INFO # Nivel de log (INFO, DEBUG, NONE)

# Configuración de Subastas
auction:
  default_duration_seconds: 86400 # 1 día en segundos
  min_duration_seconds: 3600    # 1 hora
  max_duration_seconds: 604800  # 7 días
  available_durations: # Formato: "Etiqueta:segundos"
    - "1 Hora:3600"
    - "6 Horas:21600"
    - "12 Horas:43200"
    - "1 Día:86400"
    - "3 Días:259200"
    - "7 Días:604800"
  creation_fee: # Impuesto al publicar
    enabled: true
    amount: 100.0
  commission_on_sale: # Comisión por venta (porcentaje)
    enabled: true
    percentage: 5.0 # 5%
  min_bid_increment: # Incremento mínimo para una puja
    amount: 10.0
  buy_now_allowed: true # Permitir la opción de compra directa globalmente
  max_start_price: 1000000.0 # Precio inicial máximo permitido
  item_blacklist: # Items que no se pueden subastar
    - "BEDROCK"
    - "COMMAND_BLOCK"
    # - "BARRIER" # Ejemplo, se pueden añadir más

# Configuración VIP
vip:
  permission: "aetherauctions.vip"
  max_active_auctions: 15
  extended_duration_seconds: 1209600 # 14 días
  no_creation_fee: true
  # exclusive_filters: true # Placeholder para futura funcionalidad de filtros

# Configuración de Base de Datos
database:
  type: "sqlite" # Por ahora solo sqlite, podría expandirse
  sqlite:
    file_name: "aetherauctions.db" # En la carpeta del plugin
