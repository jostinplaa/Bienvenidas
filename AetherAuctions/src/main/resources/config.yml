# AetherAuctions Configuration File

# Prefijo general del plugin usado en mensajes (si MessageManager lo usa)
plugin_prefix: "&6[&eAetherAuctions&6] &r"

general:
  currency_symbol: "$" # Símbolo de la moneda

database:
  # Tipo de base de datos. Por ahora solo soporta "sqlite".
  # Futuras expansiones podrían incluir "mysql".
  type: sqlite
  # Nombre del archivo para la base de datos SQLite (relativo a la carpeta del plugin)
  # No es necesario si solo se usa un nombre fijo como "auctions.db" hardcodeado en AuctionStorage.
  # sqlite_file_name: "auctions.db" # Opcional, si AuctionStorage lo usa

auction:
  # Duración por defecto de una subasta en horas.
  default_duration_hours: 24
  # Máximo número de subastas activas que un jugador puede tener.
  # Se pueden añadir overrides por permisos más adelante.
  max_active_auctions_per_player: 5
  # Incremento mínimo requerido para una nueva puja sobre la puja actual.
  min_bid_increment: 10.0
  # Permitir la opción de "Comprar Ahora" en las subastas.
  allow_buy_now: true
  # Porcentaje de comisión que se toma de una venta exitosa (0-100).
  # Ejemplo: 5.0 para una comisión del 5%.
  commission_fee_percentage: 5.0
  # Tarifa fija para crear una subasta. Poner a 0 para desactivar.
  creation_fee: 0.0 # Ejemplo: 100.0 para una tarifa de 100
  # Intervalo en segundos para la tarea que revisa subastas expiradas.
  expired_check_interval_seconds: 60
  # Lista de materiales que no pueden ser subastados (blacklist).
  # Usar nombres de Material de Bukkit: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
  item_blacklist:
    - "BEDROCK"
    - "COMMAND_BLOCK"
    - "STRUCTURE_VOID"
    - "BARRIER"

gui:
  # Material para los paneles decorativos en la GUI principal de subastas.
  main_decorative_pane_material: "GRAY_STAINED_GLASS_PANE"
  # Material para los paneles decorativos en la GUI de detalles de subasta.
  details_decorative_pane_material: "BLACK_STAINED_GLASS_PANE"
  # Número de subastas a mostrar por página en la GUI principal.
  items_per_page: 36 # Debe ser un múltiplo de 9 menos las filas de botones, ej. 54-9=45, 36, 27...

messages:
  # Formato para cuando una clave no se encuentra en messages.yml
  missing_key_format: "&cError: Clave '%key%' no encontrada."

# Configuraciones VIP (ejemplo, se pueden expandir)
# vip_settings:
