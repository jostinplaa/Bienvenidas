# AetherAuctions Configuration File

general:
  plugin_prefix: "&e&lAetherAuctions &8» "
  currency_symbol: "$"
  date_format: "dd/MM/yyyy HH:mm"
  max_active_auctions_per_player: 5
  log_level: INFO

auction:
  default_duration_seconds: 86400 # Fallback if available_durations is empty or unparseable initially
  min_duration_seconds: 300    # 5 minutes (updated to match new list's minimum)
  max_duration_seconds: 604800  # 7 days (updated to match new list's maximum)
  # Define available durations for auctions.
  # Format: <number><unit>, where unit can be 'm' (minutes), 'h' (hours), 'd' (days).
  available_durations:
    - "5m"
    - "15m"
    - "30m"
    - "1h"
    - "6h"
    - "12h"
    - "1d"
    - "3d"
    - "7d"
  creation_fee:
    enabled: true
    amount: 100.0
  commission_on_sale:
    enabled: true
    percentage: 5.0
  min_bid_increment:
    amount: 10.0
  buy_now_allowed: true
  max_start_price: 1000000.0
  item_blacklist:
    - "BEDROCK"
    - "COMMAND_BLOCK"

vip:
  permission: "aetherauctions.vip"
  max_active_auctions: 15
  extended_duration_seconds: 1209600 # 14 días (can be an option in available_durations too)
  no_creation_fee: true

database:
  type: "sqlite"
  sqlite:
    file_name: "aetherauctions.db"
