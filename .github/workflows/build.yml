name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*' # Trigger on tags like v1.0, v1.2.3
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -f AuctionMasterElite/pom.xml package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuctionMasterElite-JAR
          path: AuctionMasterElite/target/AuctionMasterElite-1.0.0-SNAPSHOT.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release
    steps:
      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: AuctionMasterElite-JAR
          path: .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: AuctionMasterElite-1.0.0-SNAPSHOT.jar
          body: "Release for version ${{ github.ref_name }}"
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref }}
          prerelease: false
