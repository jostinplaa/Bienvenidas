auction:
  created: "¡Has puesto en subasta {item} por {price}!"
  error: # Specific auction errors
    not-active-or-expired: "&cEsta subasta ya no está activa o ha expirado."

  # Bidding messages
  enter-bid-amount: "Ingresa tu puja:"
  bid-accepted: "&a¡Has pujado {amount} por {item}!"
  bid-too-low: "&cTu puja debe ser mayor que la puja actual o el precio inicial."
  bid-too-low-concurrent: "&cAlguien más ha pujado más alto mientras ingresabas tu puja. Inténtalo de nuevo."
  bid-higher-than-buynow: "&cTu puja no puede ser igual o mayor al precio de compra directa."
  not-enough-funds-bid: "&cNo tienes suficientes fondos para realizar esa puja."
  cannot-bid-on-own: "&cNo puedes pujar en tu propia subasta."
  already-highest-bidder: "&eYa eres el pujador más alto para esta subasta."
  invalid-bid-amount: "&cLa cantidad de puja ingresada no es un número válido."
  # bid-increment-too-small: "&cDebes aumentar la puja en al menos {amount}." # If implementing min bid increment

  # Notifications
  outbid-notification: "&e¡Has sido superado en la subasta de {item}! Nueva puja: {new_bid}."
  new-bid-notification: "&e{player} ha pujado {amount} por tu subasta de {item}."
  sold-to-player-notification-seller: "&a¡Tu subasta de {item} ha sido vendida a {buyer} por {amount}!"
  won-notification-buyer: "&a¡Has ganado la subasta de {item} por {price}!"
  buyer-no-funds-notification-seller: "&cEl comprador {buyer} de tu subasta de {item} no tenía fondos suficientes. La subasta ha sido cancelada/expirada."
  payment-failed-notification-buyer: "&cNo se pudo procesar tu pago por la subasta de {item}. Asegúrate de tener fondos suficientes."
  expired-no-bids-notification-seller: "&eTu subasta de {item} ha expirado sin pujas."
  bought-directly-notification-buyer: "&a¡Compraste {item} directamente por {price}!"
  sold-directly-notification-seller: "&a{buyer} compró tu {item} directamente por {price}!"
  outbid-by-buyout-notification: "&eLa subasta de {item} en la que pujabas fue comprada directamente por {buyer}."


  error: # Specific auction errors (ensure this is merged correctly with existing error section)
    # ... (other auction errors like not-active-or-expired)
    buy-now-not-available: "&cLa opción de compra directa no está disponible para esta subasta."
    cannot-buy-own: "&cNo puedes comprar tu propia subasta."

  gui:
    no-auctions: "&eNo hay subastas activas en este momento."
    item-name-prefix: "&b"
    # Lore lines for items in auction GUI
    lore:
      seller: "&7Vendedor: &e{seller_name}"
      initial-price: "&7Precio Inicial: &c{amount}"
      current-bid: "&7Puja Actual: &c{amount}"
      highest-bidder: "&7Pujador Máximo: &d{player_name}"
      no-current-bidder: "&7Pujador Máximo: &8Nadie"
      buy-now-price: "&7Compra Directa: &6{amount}"
      buy-now-not-available: "&7Compra Directa: &8No disponible"
      time-left: "&7Tiempo Restante: &b{time}"
      bid-instruction: "&eClick Izquierdo: Pujar"
      buy-instruction: "&6Click Derecho: Comprar"
    button: # Renamed from direct previous-page, next-page etc. for structure
      previous-page-name: "&aPágina Anterior"
      next-page-name: "&aPágina Siguiente"
      refresh-name: "&eActualizar"
      close-gui-name: "&cCerrar"

