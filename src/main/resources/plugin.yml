name: Subastas
version: 0.1.0
main: com.julesmc.subastas.SubastasPlugin
api-version: 1.18
authors: [Jules, TuNombreDeUsuario]
description: Un plugin de subastas completo y profesional.
website: # (Opcional, se puede añadir después)
depend: [Vault]
commands:
  subastas:
    description: Comando principal para el plugin de Subastas.
    aliases: [sub, auction, auctions]
permissions:
  subastas.admin.reload:
    description: Permite recargar la configuración del plugin Subastas.
    default: op
  subastas.player.help:
    description: Permite usar el comando de ayuda de Subastas.
    default: true
  subastas.player.create:
    description: Permite crear nuevas subastas.
    default: true
  subastas.player.view:
    description: Permite ver las subastas activas en la GUI.
    default: true
  # Otros permisos se añadirán a medida que se implementen comandos
